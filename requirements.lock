# Resolved dependency set for a working Python 3.11 install of
#   uv venv --python 3.11 && uv pip install -e ".[yahoo,dev]" "setuptools<81"
# which is the README's install line. Third-party only; the editable install of
# this package itself is left out, matching npf and cot-analyzer's locks.
#
# This is a RECORD, not an input: nothing installs from it and no CI step checks
# it, again as in those two repos. It exists so a machine that resolves something
# different has something to be compared against -- the producer box runs this
# package unattended and resolves its own venv, and until now there was nothing
# to diff it with. Regenerate after a dependency change with:
#   uv pip freeze | grep -v '^-e\|@ file://\|^crucible-marketdata\|^marketdata==' | sort
