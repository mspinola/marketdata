# marketdata symbol registry — internal symbol is the identity, vendor tickers are
# attributes. Grouped by asset class purely for readability and for consumers
# that want to slice a universe.
#
# Per-symbol keys (all optional except that SOME vendor mapping must resolve):
#   yahoo         Yahoo ticker. null means Yahoo cannot serve it.
#   norgate       Norgate symbol. null means Norgate cannot serve it. Left unset
#                 (defaults to the internal name) so the seam is ready if a
#                 Norgate US Stocks subscription lands. See ADR note in README.
#   cboe          Cboe index symbol, the <symbol> of Cboe's <symbol>_History.csv.
#                 Never defaulted; only the volatility indices exist there. Pair it
#                 with `price_source: cboe`, since Yahoo carries the same tickers
#                 and the deployment default would otherwise win.
#   tradingview   TradingView symbol, EXCHANGE:TICKER ("INDEX:NCFD"). Never
#                 defaulted; only the `series` domain lives there. The producer is
#                 a Claude routine on the box plus `--build-tradingview`, not a
#                 fetch (providers/tradingview.py).
#   price_source  per-symbol override: yfinance | norgate | cboe | tradingview
#   inception     first date the instrument existed, for a sanity check on fetch
#   kind          `series` only: percent | count | ratio. Fixes the range the
#                 build validates against.
#   anchors       `series` only: {date: value} published readings the build
#                 re-verifies whenever it touches those dates. The proof that a
#                 vendor symbol string still names the same series.
#   note          free text
#
# SURVIVORSHIP: every symbol here is currently listed. yfinance cannot serve
# delisted securities or point-in-time index membership, so this registry is NOT
# a point-in-time universe and must never be treated as one. That fact is
# recorded in the store, not just here: the manifest carries
# `universe_is_point_in_time`, and a study that ranks or selects ACROSS symbols
# should assert `marketdata.store.require_point_in_time()` rather than remember.
# Per-symbol studies are unaffected.

Equity Index ETF:
  SPY:
    yahoo: "SPY"
    inception: "1993-01-29"
  VTI:
    yahoo: "VTI"
    inception: "2001-05-24"
  QQQ:
    yahoo: "QQQ"
    inception: "1999-03-10"
  IWM:
    yahoo: "IWM"
    inception: "2000-05-22"
  DIA:
    yahoo: "DIA"
    inception: "1998-01-14"
    note: "SPDR Dow Jones Industrial Average. Index row on cot-analyzer's market internals page (/internals); no ratio leg."

# The MSCI international indices are the one place a COT market is priced off an ETF
# rather than its own futures. MFS and MME have ICE futures that Norgate does not carry
# a continuous series for, so cotmetrics reads the proxy instead. Registered here as
# ordinary equity ETFs, under their OWN tickers: the proxy relationship is cotmetrics'
# to know, and encoding it here would put a consumer's modelling choice in the registry.
MSCI International ETF:
  EFA:
    yahoo: "EFA"
    inception: "2001-08-14"
    note: "iShares MSCI EAFE. Price proxy for the ICE MSCI EAFE future (COT symbol MFS)."
  EEM:
    yahoo: "EEM"
    inception: "2003-04-07"
    note: "iShares MSCI Emerging Markets. Price proxy for the ICE MSCI EM future (COT symbol MME)."

Treasury ETF:
  TLT:
    yahoo: "TLT"
    inception: "2002-07-30"
    note: "monthly distributions — total-return tier matters for any multi-week hold"
  IEF:
    yahoo: "IEF"
    inception: "2002-07-26"
  SHY:
    yahoo: "SHY"
    inception: "2002-07-22"

Commodity ETF:
  GLD:
    yahoo: "GLD"
    inception: "2004-11-18"
  USO:
    yahoo: "USO"
    inception: "2006-04-10"
    note: "United States Oil Fund. Asset row on cot-analyzer's market internals page; a futures-holding fund whose price series is NOT a proxy for CL (roll yield), so nothing prices a COT market off it."

# The tape-context set: four ratios cot-analyzer scores on the crowd board's own
# windows beside COT positioning (docs/design/breadth-domain-scoping.md). Each new
# symbol is one leg of a ratio whose other leg was already here. Ratios with a
# dividend gap between the legs (XLP/QQQ, HYG/IEF) must be drawn on the `total`
# tier: XLP distributes ~2.5%/yr against QQQ's <1%, so a split-tier ratio drifts
# about two points a year in QQQ's favour. Chosen because they need no new vendor:
# Norgate's breadth series ($/# indicators) need a US Stocks subscription this
# deployment does not have, and RSP/SPY is the cheapest honest breadth proxy.
Sector ETF:
  XLP:
    yahoo: "XLP"
    inception: "1998-12-16"
    note: "Consumer Staples Select Sector SPDR. Defensive leg of XLP/QQQ (defensive vs growth). Class name kept generic so XLK/XLU can join it."

Equal Weight ETF:
  RSP:
    yahoo: "RSP"
    inception: "2003-04-24"
    note: "Invesco S&P 500 Equal Weight. RSP/SPY falls when a few names carry the index: the breadth proxy that stands in for new-highs counts until a breadth vendor exists."

Credit ETF:
  HYG:
    yahoo: "HYG"
    inception: "2007-04-04"
    note: "iShares iBoxx $ High Yield Corporate Bond. HYG/IEF is credit appetite; total tier only, both legs distribute monthly."
  JNK:
    yahoo: "JNK"
    inception: "2007-11-28"
    note: "SPDR Bloomberg High Yield Bond. The credit read on cot-analyzer's market internals page: the PRICE (split tier) against its own 20-day average, so a monthly distribution does not sit in both. Not a second leg of HYG/IEF."

Broad Bond ETF:
  AGG:
    yahoo: "AGG"
    inception: "2003-09-22"

# Not "Crypto": that class name maps to the FUTURES domain in registry._CLASS_DOMAIN
# (BTC, ETH), and an ETF under it would be fetched as a Norgate continuous contract.
Crypto ETF:
  IBIT:
    yahoo: "IBIT"
    inception: "2024-01-11"
    note: "iShares Bitcoin Trust. Asset row on cot-analyzer's market internals page. Spot bitcoin, not the CME future; nothing prices BTC's COT off it."

# KEPT DELIBERATELY. These four have been removed twice, on 2026-07-xx and again on
# 2026-08-21, both times on the belief that nothing used them. Something does:
# npf/trading_riot maps each to a realized counterpart (VIX->ES, VXN->NQ, OVX->CL,
# GVZ->GC) for a variance-risk-premium study, and its data.py documents fetching them
# with `marketdata-update --bars --symbols VIX`.
#
# Both removals were justified by a note kept somewhere else saying they were retired.
# Neither removal checked the consumer, because the consumer is in another repo and a
# grep of THIS one comes back clean. That is the trap: absence of a local reference is
# not evidence of absence of a dependency.
#
# So the reason lives here, next to the thing it governs, rather than in a document
# that can drift out of step with it. If trading_riot is genuinely retired, delete
# these four AND say so here in the same commit -- do not leave the next reader to
# rediscover the dependency from a failed fetch.
Volatility Index:
  VIX:
    yahoo: "^VIX"
    inception: "1990-01-02"
    note: "CBOE 30-day implied vol index. No corporate actions, so the split/raw tiers are a passthrough. It is an implied-vol series, not a tradable price."
  VXN:
    yahoo: "^VXN"
    inception: "2001-01-23"
    note: "CBOE Nasdaq-100 implied vol. Implied series, not tradable. Realized counterpart: NQ."
  OVX:
    yahoo: "^OVX"
    inception: "2007-05-10"
    note: "CBOE crude-oil ETF (USO) implied vol. Implied series, not tradable. Realized counterpart: CL."
  GVZ:
    yahoo: "^GVZ"
    inception: "2008-06-03"
    note: "CBOE gold ETF (GLD) implied vol. Implied series, not tradable. Realized counterpart: GC."
  VIX3M:
    yahoo: "^VIX3M"
    cboe: "VIX3M"
    price_source: cboe
    inception: "2007-12-04"
    note: "CBOE 3-month S&P 500 implied vol (formerly VXV). Implied series, not tradable. VIX3M/VIX is the term-structure read: below 1 means the front is above the 3-month, the inversion that marks stress. Tape-context set, not trading_riot. Pinned to Cboe's own CSV because Yahoo serves this ticker patchily (measured 2026-09-14: a full pull ended 2026-07-17, a 3-month pull had 24 rows against 64 for ^VIX); Cboe's file starts 2009-09-18."

# ── Futures ───────────────────────────────────────────────────────────────
# Ported from cotdata's registry (ADR-0007 step 2: bars move here, CFTC
# positioning stays there). Internal symbols and sector names are cotdata's, so
# the two registries stay readable side by side and a repointed consumer keeps
# passing the same symbol strings.
#
# `norgate` is explicit on every row because this registry defaults an unset
# vendor mapping to the internal name, and Norgate's continuous symbols carry a
# leading '&' ("&ES", not "ES"). `yahoo: null` is equally deliberate: Yahoo's
# continuous-futures tickers (SB=F and friends) exist in cotdata only as the
# fallback for a databento deployment, which ADR-0007 scopes out of this
# provider. Leaving them unset would silently default to the internal symbol and
# resolve futures reads to an equity ticker of the same name.
#
# NOT ported: MME and MFS (MSCI EM / EAFE). Norgate carries no continuous series
# for either, so cotdata prices them off the EEM and EFA ETF proxies through
# yfinance. That needs a futures-domain path in the yfinance provider, which is
# a separate piece of work from the Norgate producer this registry serves.

Equity Index Futures:
  ES:  {norgate: "&ES",  yahoo: null}
  NQ:  {norgate: "&NQ",  yahoo: null}
  YM:  {norgate: "&YM",  yahoo: null}
  RTY: {norgate: "&RTY", yahoo: null}
