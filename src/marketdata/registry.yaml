# ── Futures ───────────────────────────────────────────────────────────────
# Ported from cotdata's registry (ADR-0007 step 2: bars move here, CFTC
# positioning stays there). Internal symbols and sector names are cotdata's, so
# the two registries stay readable side by side and a repointed consumer keeps
# passing the same symbol strings.
#
# `norgate` is explicit on every row because this registry defaults an unset
# vendor mapping to the internal name, and Norgate's continuous symbols carry a
# leading '&' ("&ES", not "ES"). `yahoo: null` is equally deliberate: Yahoo's
# continuous-futures tickers (SB=F and friends) exist in cotdata only as the
# fallback for a databento deployment, which ADR-0007 scopes out of this
# provider. Leaving them unset would silently default to the internal symbol and
# resolve futures reads to an equity ticker of the same name.
#
# NOT ported: MME and MFS (MSCI EM / EAFE). Norgate carries no continuous series
# for either, so cotdata prices them off the EEM and EFA ETF proxies through
# yfinance. That needs a futures-domain path in the yfinance provider, which is
# a separate piece of work from the Norgate producer this registry serves.

Equity Index Futures:
  ES:  {norgate: "&ES",  yahoo: null}
  NQ:  {norgate: "&NQ",  yahoo: null}
  YM:  {norgate: "&YM",  yahoo: null}
  RTY: {norgate: "&RTY", yahoo: null}
  EMD: {norgate: "&EMD", yahoo: null, note: "E-mini S&P MidCap 400 (CME)"}
  NKD: {norgate: "&NKD", yahoo: null, note: "Nikkei 225, $-denominated (CME)"}

