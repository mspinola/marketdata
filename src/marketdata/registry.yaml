    note: "Nasdaq issues advancing on the session, daily count. With NASDAQ_DEC it is the advancing-share read on cot-analyzer's market internals page. `inception` is a 5000-bar cap. The declining symbol is DECLQ, not DECQ: DECQ does not resolve (checked 2026-09-17)."
