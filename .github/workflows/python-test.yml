name: Python package

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install -e ".[yahoo,dev]"
    - name: Run linting
      run: python -m ruff check src tests
    - name: Run tests
      env:
        # The store guard raises when unset, so give every test a real path even
        # though the ones that write use the tmp_store fixture.
        MARKETDATA_STORE: /tmp/marketdata_store
        # Belt and braces with the -m filter below: any test that reaches for the
        # network skips rather than hanging a runner on a flaky free feed.
        MARKETDATA_NO_NETWORK: "1"
      run: |
        mkdir -p /tmp/marketdata_store
        pytest tests/ -q -m "not network"
